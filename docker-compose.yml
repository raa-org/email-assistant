services:
  postgres:
    image: postgres:16
    container_name: raa-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: raa_assistant
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # networks:
    #   - app-network
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U tooljet"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 5
    #   shm_size: 256mb



  redis:
    image: redis:7
    container_name: raa-assistant-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
